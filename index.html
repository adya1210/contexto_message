<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smartest Dumb Phone</title>
  <style>
    :root { color-scheme: dark; --ink:#eef2ff; --muted:#aab2c8; --panel:#151a2b; --line:#303650; --accent:#8da2ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at top,#252d52,#0d1020 55%); color:var(--ink); font-family:system-ui,-apple-system,sans-serif; }
    main { width:min(92vw,560px); background:rgba(21,26,43,.94); border:1px solid var(--line); border-radius:24px; padding:28px; box-shadow:0 24px 70px rgba(0,0,0,.35); }
    h1 { margin:0 0 6px; font-size:clamp(26px,7vw,38px); }
    h2 { margin:0 0 14px; }
    p { color:var(--muted); line-height:1.5; }
    .tabs { display:flex; gap:8px; margin:20px 0; }
    button { border:0; border-radius:12px; padding:12px 16px; font-weight:700; cursor:pointer; }
    .tab { flex:1; background:#252b43; color:var(--ink); }
    .tab.active { background:var(--accent); color:#101426; }
    .primary { background:var(--accent); color:#101426; }
    input { width:100%; border:1px solid var(--line); border-radius:12px; padding:14px; background:#0f1322; color:var(--ink); font-size:16px; }
    .row { display:flex; gap:8px; margin-top:10px; }
    .row input { flex:1; min-width:0; }
    .panel { display:none; }
    .panel.active { display:block; }
    .status { min-height:24px; margin:12px 0 0; }
    .guesses { display:grid; gap:8px; margin-top:16px; }
    .guess { display:flex; justify-content:space-between; gap:12px; padding:11px 12px; background:#0f1322; border-radius:10px; }
    .score { color:#b9c4ff; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Smartest Dumb Phone</h1>
    <p>Set a secret word, then guess it. Scores indicate how close each guess is.</p>
    <div class="tabs">
      <button class="tab active" data-tab="set">Set word</button>
      <button class="tab" data-tab="guess">Guess</button>
    </div>

    <section id="set" class="panel active">
      <h2>Choose a secret word</h2>
      <input id="secret" type="text" maxlength="40" placeholder="Enter one word" autocomplete="off">
      <div class="row"><button id="save" class="primary">Save word</button></div>
      <p id="set-status" class="status"></p>
    </section>

    <section id="guess" class="panel">
      <h2>Make a guess</h2>
      <div class="row">
        <input id="guess-input" type="text" maxlength="40" placeholder="Type a word" autocomplete="off">
        <button id="guess-button" class="primary">Check</button>
      </div>
      <p id="guess-status" class="status"></p>
      <div id="guesses" class="guesses"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "smartest-dumb-phone-word";
    const secretInput = document.querySelector("#secret");
    const guessInput = document.querySelector("#guess-input");
    const guesses = document.querySelector("#guesses");

    function normalize(value) {
      return value.trim().toLowerCase().replace(/[^a-z0-9]+/g, "");
    }

    function getSecret() {
      return localStorage.getItem(STORAGE_KEY) || "";
    }

    function editDistance(a, b) {
      const row = Array.from({ length: b.length + 1 }, (_, i) => i);
      for (let i = 1; i <= a.length; i++) {
        let previous = row[0];
        row[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const saved = row[j];
          row[j] = Math.min(row[j] + 1, row[j - 1] + 1, previous + (a[i - 1] === b[j - 1] ? 0 : 1));
          previous = saved;
        }
      }
      return row[b.length];
    }

    function similarity(secret, guess) {
      const a = normalize(secret);
      const b = normalize(guess);
      if (!a || !b) return 0;
      if (a === b) return 1;

      const longest = Math.max(a.length, b.length);
      const spelling = 1 - editDistance(a, b) / longest;

      const groups = [
        ["thanksgiving","turkey","pilgrim","harvest","autumn","family","feast","pumpkin"],
        ["summer","winter","spring","autumn","sun","snow","rain","season"],
        ["dog","puppy","cat","pet","animal","kitten","horse"],
        ["phone","computer","keyboard","screen","technology","internet","phone"],
        ["apple","banana","orange","fruit","pear","peach","grape"],
        ["food","pizza","burger","pasta","bread","meal","dinner","lunch"]
      ];
      let semantic = 0;
      for (const group of groups) {
        if (group.includes(a) && group.includes(b)) semantic = .72;
      }

      return Math.max(0, Math.min(1, Math.max(spelling * .35, semantic)));
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab, .panel").forEach(element => element.classList.remove("active"));
        tab.classList.add("active");
        document.querySelector("#" + tab.dataset.tab).classList.add("active");
      });
    });

    document.querySelector("#save").addEventListener("click", () => {
      const word = normalize(secretInput.value);
      if (!word) {
        document.querySelector("#set-status").textContent = "Please enter a secret word.";
        return;
      }
      localStorage.setItem(STORAGE_KEY, word);
      document.querySelector("#set-status").textContent = "Word saved on this device.";
      secretInput.value = "";
      guesses.replaceChildren();
    });

    function makeGuess() {
      const secret = getSecret();
      const guess = normalize(guessInput.value);
      if (!secret) {
        document.querySelector("#guess-status").textContent = "Set a secret word first.";
        return;
      }
      if (!guess) {
        document.querySelector("#guess-status").textContent = "Enter a guess.";
        return;
      }
      const score = similarity(secret, guess);
      const row = document.createElement("div");
      row.className = "guess";
      row.innerHTML = `<span></span><span class="score"></span>`;
      row.firstElementChild.textContent = guessInput.value.trim();
      row.lastElementChild.textContent = (score * 100).toFixed(0) + "%";
      guesses.prepend(row);
      document.querySelector("#guess-status").textContent =
        score === 1 ? "Correct! You found the word." : "Keep guessing.";
      guessInput.value = "";
      guessInput.focus();
    }

    document.querySelector("#guess-button").addEventListener("click", makeGuess);
    guessInput.addEventListener("keydown", event => {
      if (event.key === "Enter") makeGuess();
    });

    secretInput.value = getSecret();
  </script>
</body>
</html>
