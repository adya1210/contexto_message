<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-url" content="https://message-contexto-api.onrender.com">
  <title>Message Contexto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --px: 4px;
      --bg: #eef3f6;
      --bg-dot: #dde6ec;
      --surface: #ffffff;
      --surface-2: #f7f9f9;
      --field: #ffffff;
      --ink: #0f1419;
      --muted: #536471;
      --outline: #0f1419;
      --line: #cfd9de;
      --track: #eff3f4;
      --shadow: rgba(15, 20, 25, .14);
      --accent: #1d9bf0;
      --accent-hover: #4cb0f3;
      --accent-shade: #0f6fb0;
      --green: #00ba7c;
      --green-shade: #00875a;
      --yellow: #ef7d31;
      --yellow-shade: #b85715;
      --red: #f91880;
      --red-shade: #b80e5c;
      --on-bar: #0f1419;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #15202b;
        --bg-dot: #1b2834;
        --surface: #1e2732;
        --surface-2: #273340;
        --field: #15202b;
        --ink: #f7f9f9;
        --muted: #8b98a5;
        --outline: #070b0f;
        --line: #38444d;
        --track: #15202b;
        --shadow: rgba(0, 0, 0, .35);
        --on-bar: #0f1419;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #15202b;
      --bg-dot: #1b2834;
      --surface: #1e2732;
      --surface-2: #273340;
      --field: #15202b;
      --ink: #f7f9f9;
      --muted: #8b98a5;
      --outline: #070b0f;
      --line: #38444d;
      --track: #15202b;
      --shadow: rgba(0, 0, 0, .35);
      --on-bar: #0f1419;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background-color: var(--bg);
      background-image: radial-gradient(var(--bg-dot) 2px, transparent 2px);
      background-size: 16px 16px;
      color: var(--ink);
      font-family: "VT323", ui-monospace, monospace;
      font-size: 22px;
      image-rendering: pixelated;
    }

    /* ---------- the window ---------- */
    .window {
      width: min(calc(100% - var(--px) * 2), 600px);
      min-width: 0;
      background: var(--surface);
      margin: var(--px);
      box-shadow:
        calc(var(--px) * -1) 0 0 0 var(--outline),
        var(--px) 0 0 0 var(--outline),
        0 calc(var(--px) * -1) 0 0 var(--outline),
        0 var(--px) 0 0 var(--outline),
        12px 16px 0 0 var(--shadow);
    }
    .titlebar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--accent);
      border-bottom: var(--px) solid var(--outline);
    }
    .titlebar .dots { display: flex; gap: 6px; }
    .titlebar .title {
      flex: 1;
      min-width: 0;
      text-align: center;
      font-family: "Silkscreen", monospace;
      font-size: 14px;
      color: #fff;
      text-shadow: 2px 2px 0 var(--accent-shade);
      letter-spacing: .04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sprite { display: block; image-rendering: pixelated; shape-rendering: crispEdges; }
    .window-body { padding: 24px 24px 28px; }

    h1 {
      margin: 0;
      font-family: "Silkscreen", monospace;
      font-weight: 700;
      font-size: clamp(26px, 7vw, 40px);
      line-height: 1.05;
      color: var(--ink);
      letter-spacing: .02em;
    }
    h1 .accent { color: var(--accent); text-shadow: 3px 3px 0 var(--accent-shade); }
    h2 {
      margin: 0 0 12px;
      font-family: "Silkscreen", monospace;
      font-size: 16px;
      color: var(--ink);
    }
    h2::before { content: "▸ "; color: var(--accent); }
    p { line-height: 1.15; margin: 10px 0; }
    .tagline { color: var(--muted); }

    /* ---------- buttons ---------- */
    button {
      position: relative;
      margin: var(--px);
      border: 0;
      padding: 10px 18px 12px;
      font-family: "Silkscreen", monospace;
      font-size: 15px;
      letter-spacing: .03em;
      cursor: pointer;
      color: white;
      background: var(--accent);
      text-shadow: 2px 2px 0 var(--accent-shade);
      box-shadow:
        calc(var(--px) * -1) 0 0 0 var(--outline),
        var(--px) 0 0 0 var(--outline),
        0 calc(var(--px) * -1) 0 0 var(--outline),
        0 var(--px) 0 0 var(--outline),
        inset 0 calc(var(--px) * -1) 0 0 var(--accent-shade),
        inset var(--px) var(--px) 0 0 rgba(255, 255, 255, .35);
      transition: transform .05s steps(1);
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:active:not(:disabled) {
      transform: translateY(var(--px));
      box-shadow:
        calc(var(--px) * -1) 0 0 0 var(--outline),
        var(--px) 0 0 0 var(--outline),
        0 calc(var(--px) * -1) 0 0 var(--outline),
        0 var(--px) 0 0 var(--outline),
        inset 0 var(--px) 0 0 var(--accent-shade);
    }
    button:disabled { opacity: .55; cursor: wait; }
    button:focus-visible { outline: var(--px) dashed var(--accent); outline-offset: 6px; }

    /* ---------- tabs ---------- */
    .tabs { display: flex; gap: 12px; margin: 22px 0 22px; }
    .tab {
      flex: 1;
      background: var(--surface-2);
      color: var(--ink);
      text-shadow: none;
      box-shadow:
        calc(var(--px) * -1) 0 0 0 var(--outline),
        var(--px) 0 0 0 var(--outline),
        0 calc(var(--px) * -1) 0 0 var(--outline),
        0 var(--px) 0 0 var(--outline),
        inset 0 calc(var(--px) * -1) 0 0 var(--line);
    }
    .tab:hover:not(:disabled) { background: var(--surface); }
    .tab.active {
      background: var(--accent);
      color: white;
      text-shadow: 2px 2px 0 var(--accent-shade);
      transform: translateY(var(--px));
      box-shadow:
        calc(var(--px) * -1) 0 0 0 var(--outline),
        var(--px) 0 0 0 var(--outline),
        0 calc(var(--px) * -1) 0 0 var(--outline),
        0 var(--px) 0 0 var(--outline),
        inset 0 var(--px) 0 0 var(--accent-shade);
    }
    .tab.active::before { content: "» "; }
    .tab.active::after { content: " «"; }

    /* ---------- inputs ---------- */
    label { display: block; margin-top: 16px; font-size: 20px; color: var(--muted); }
    textarea, input {
      display: block;
      width: calc(100% - var(--px) * 2);
      margin: var(--px);
      border: 0;
      background: var(--field);
      color: var(--ink);
      font-family: "VT323", monospace;
      font-size: 24px;
      box-shadow:
        calc(var(--px) * -1) 0 0 0 var(--outline),
        var(--px) 0 0 0 var(--outline),
        0 calc(var(--px) * -1) 0 0 var(--outline),
        0 var(--px) 0 0 var(--outline),
        inset var(--px) var(--px) 0 0 var(--shadow);
    }
    textarea::placeholder, input::placeholder { color: var(--muted); opacity: .8; }
    textarea:focus, input:focus {
      outline: none;
      box-shadow:
        calc(var(--px) * -1) 0 0 0 var(--accent),
        var(--px) 0 0 0 var(--accent),
        0 calc(var(--px) * -1) 0 0 var(--accent),
        0 var(--px) 0 0 var(--accent),
        inset var(--px) var(--px) 0 0 var(--shadow);
    }
    textarea { min-height: 120px; resize: vertical; padding: 10px 14px; }
    input { padding: 8px 14px; }
    .row { display: flex; gap: 12px; margin-top: 14px; align-items: stretch; }
    .row input { flex: 1; min-width: 0; width: auto; }
    .row button { white-space: nowrap; }

    .panel { display: none; }
    .panel.active { display: block; }
    .status { min-height: 26px; margin: 14px 0 0; }
    .status:not(:empty)::before { content: "> "; color: var(--accent); }
    .status.is-green { color: var(--green-shade); }
    .status.is-yellow { color: var(--yellow-shade); }
    .status.is-red { color: var(--red-shade); }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .status.is-green { color: var(--green); }
      :root:not([data-theme="light"]) .status.is-yellow { color: var(--yellow); }
      :root:not([data-theme="light"]) .status.is-red { color: var(--red); }
    }

    /* ---------- hint ---------- */
    .hint-button { margin-top: 16px; }
    .hint-button::before { content: "? "; }
    .hint-message { min-height: 24px; margin: 10px 0 0; color: var(--muted); }
    .hint-word {
      margin: 8px 0;
      color: var(--ink);
      font-family: "Silkscreen", monospace;
      font-size: 26px;
      letter-spacing: .3em;
      overflow-wrap: anywhere;
    }

    /* ---------- stats + legend ---------- */
    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px 16px;
      margin-top: 22px;
      font-family: "Silkscreen", monospace;
      font-size: 13px;
      color: var(--muted);
    }
    .stats[hidden] { display: none; }
    .count b { color: var(--ink); font-weight: 700; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 12px; height: 12px; display: inline-block; box-shadow: 0 0 0 2px var(--outline); }
    .legend .g { background: var(--green); }
    .legend .y { background: var(--yellow); }
    .legend .r { background: var(--red); }

    /* ---------- guess list (Contexto-style bars) ---------- */
    .last-guess { margin-top: 14px; }
    .last-guess:empty { display: none; }
    .last-guess .guess { box-shadow:
        calc(var(--px) * -1) 0 0 0 var(--accent),
        var(--px) 0 0 0 var(--accent),
        0 calc(var(--px) * -1) 0 0 var(--accent),
        0 var(--px) 0 0 var(--accent); }
    .divider { height: var(--px); margin: 18px 0 4px; background: var(--line); }
    .divider[hidden] { display: none; }
    .guesses { display: grid; gap: 12px; margin-top: 14px; }
    .guess {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-height: 40px;
      margin: var(--px);
      padding: 4px 14px;
      background: var(--track);
      overflow: hidden;
      box-shadow:
        calc(var(--px) * -1) 0 0 0 var(--outline),
        var(--px) 0 0 0 var(--outline),
        0 calc(var(--px) * -1) 0 0 var(--outline),
        0 var(--px) 0 0 var(--outline);
      animation: guess-in .3s steps(3) both;
    }
    .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      background: var(--red);
      box-shadow: inset 0 var(--px) 0 0 rgba(255, 255, 255, .35), inset 0 calc(var(--px) * -1) 0 0 var(--red-shade);
      transition: width .6s steps(10);
    }
    .guess.green .fill { background: var(--green); box-shadow: inset 0 var(--px) 0 0 rgba(255, 255, 255, .35), inset 0 calc(var(--px) * -1) 0 0 var(--green-shade); }
    .guess.yellow .fill { background: var(--yellow); box-shadow: inset 0 var(--px) 0 0 rgba(255, 255, 255, .35), inset 0 calc(var(--px) * -1) 0 0 var(--yellow-shade); }
    .guess-name, .score { position: relative; z-index: 1; }
    .guess-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 26px;
    }
    .score {
      flex: none;
      font-family: "Silkscreen", monospace;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .guess.latest .guess-name::before { content: "▸ "; color: var(--accent); }
    .guess.correct .guess-name::after { content: " ★"; }
    @keyframes guess-in { from { opacity: 0; transform: translateX(-12px); } }

    /* ---------- reveal ---------- */
    .reveal {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 20px 16px;
      overflow: hidden;
      background: rgba(15, 20, 25, .55);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s steps(4), visibility .25s;
    }
    .reveal.show { opacity: 1; visibility: visible; }
    .confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; }
    .letter-card {
      position: relative;
      z-index: 1;
      width: min(100%, 440px);
      text-align: center;
      transform: translateY(40px);
      opacity: 0;
    }
    .reveal.show .letter-card { animation: letter-pop .5s steps(5) forwards; }
    .letter-card .window-body { padding: 18px 22px 24px; }
    .envelope { position: relative; height: 150px; margin: 4px auto 14px; display: grid; place-items: center; }
    .envelope > span { position: absolute; inset: 0; display: grid; place-items: center; }
    .env-closed { opacity: 1; }
    .env-open { opacity: 0; }
    .reveal.show .env-closed { animation: env-wiggle .7s steps(1) forwards; }
    .reveal.show .env-open { animation: env-open .5s .7s steps(4) forwards; }
    .letter-card h2 {
      margin: 0;
      font-size: 20px;
      color: var(--green);
      text-shadow: 2px 2px 0 var(--outline);
    }
    .letter-card h2::before { content: ""; }
    .revealed-message {
      margin: 14px var(--px) 20px;
      padding: 14px;
      background: var(--surface-2);
      color: var(--ink);
      font-size: 24px;
      line-height: 1.15;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      text-align: left;
      box-shadow:
        calc(var(--px) * -1) 0 0 0 var(--outline),
        var(--px) 0 0 0 var(--outline),
        0 calc(var(--px) * -1) 0 0 var(--outline),
        0 var(--px) 0 0 var(--outline);
    }
    .close-reveal::before { content: "« "; }
    .close-reveal::after { content: " »"; }

    @keyframes letter-pop {
      60% { transform: translateY(-8px); opacity: 1; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes env-wiggle {
      0%   { transform: translateX(0); }
      15%  { transform: translateX(-6px) rotate(-4deg); }
      30%  { transform: translateX(6px) rotate(4deg); }
      45%  { transform: translateX(-6px) rotate(-4deg); }
      60%  { transform: translateX(6px) rotate(4deg); }
      75%  { transform: translateX(0); }
      100% { transform: translateX(0); opacity: 0; }
    }
    @keyframes env-open {
      from { opacity: 0; transform: translateY(12px) scale(.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 480px) {
      body { font-size: 20px; }
      .window-body { padding: 18px 16px 22px; }
      .titlebar .title { font-size: 11px; }
      .tabs { gap: 8px; }
      .tab { padding: 10px 8px 12px; font-size: 13px; }
      .guess-name { font-size: 23px; }
      .stats { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; animation-delay: 0s !important; }
    }
  </style>
</head>
<body>
  <main class="window">
    <div class="titlebar" aria-hidden="true">
      <div class="dots">
        <span data-sprite="dot" data-colors="red" data-scale="3"></span>
        <span data-sprite="dot" data-colors="yellow" data-scale="3"></span>
        <span data-sprite="dot" data-colors="green" data-scale="3"></span>
      </div>
      <span class="title">message_contexto.exe</span>
      <span data-sprite="close" data-scale="3"></span>
    </div>
    <div class="window-body">
      <h1>Message <span class="accent">Contexto</span></h1>
      <p class="tagline">Write a message and the game chooses the word it considers most guessable.</p>
      <div class="tabs">
        <button class="tab active" data-tab="guess">Guess</button>
        <button class="tab" data-tab="set">Set message</button>
      </div>
      <section id="guess" class="panel active">
        <h2>Make a guess</h2>
        <div class="row">
          <input id="guess-input" type="text" maxlength="40" placeholder="Type a word" autocomplete="off">
          <button id="guess-button" class="primary">Check</button>
        </div>
        <p id="guess-status" class="status"></p>
        <button id="hint-button" class="hint-button">Get a hint</button>
        <p id="hint-status" class="hint-message" aria-live="polite"></p>
        <p id="hint-word" class="hint-word" aria-live="polite"></p>
        <div id="stats" class="stats" hidden>
          <span class="count">Guesses: <b id="guess-count">0</b></span>
          <span class="legend" aria-label="Color key">
            <span><i class="g"></i>close</span>
            <span><i class="y"></i>warm</span>
            <span><i class="r"></i>far</span>
          </span>
        </div>
        <div id="last-guess" class="last-guess" aria-live="polite"></div>
        <div id="divider" class="divider" hidden></div>
        <div id="guesses" class="guesses"></div>
      </section>
      <section id="set" class="panel">
        <h2>Write a message</h2>
        <textarea id="message" maxlength="500" placeholder="For example: Wow! What an amazing game!"></textarea>
        <label for="admin-key">Game owner key (only needed to set a message)</label>
        <input id="admin-key" type="password" maxlength="200" placeholder="Only needed when setting a message" autocomplete="off">
        <div class="row"><button id="save" class="primary">Set the word</button></div>
        <p id="set-status" class="status"></p>
      </section>
    </div>
  </main>
  <div id="reveal" class="reveal" aria-hidden="true">
    <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
    <section class="letter-card window" role="dialog" aria-modal="true" aria-labelledby="reveal-title">
      <div class="titlebar" aria-hidden="true">
        <div class="dots">
          <span data-sprite="dot" data-colors="red" data-scale="3"></span>
          <span data-sprite="dot" data-colors="yellow" data-scale="3"></span>
          <span data-sprite="dot" data-colors="green" data-scale="3"></span>
        </div>
        <span class="title">new_message.txt</span>
        <span data-sprite="close" data-scale="3"></span>
      </div>
      <div class="window-body">
        <div class="envelope" aria-hidden="true">
          <span class="env-closed" data-sprite="envelope" data-scale="8"></span>
          <span class="env-open" data-sprite="envelopeOpen" data-scale="8"></span>
        </div>
        <h2 id="reveal-title">You found the word!</h2>
        <p id="revealed-message" class="revealed-message"></p>
        <button id="close-reveal" class="close-reveal">Exit</button>
      </div>
    </section>
  </div>
  <script>
    // When served by the local Flask app, talk to it instead of the deployed API.
    const IS_LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
    const API_URL = IS_LOCAL ? "" : (document.querySelector('meta[name="api-url"]')?.content || "");

    /* ---------- pixel sprites ---------- */
    const PALETTES = {
      red:    { k: "#0f1419", p: "#f91880", w: "#ff8cc0", s: "#b80e5c" },
      yellow: { k: "#0f1419", p: "#ef7d31", w: "#f8b98c", s: "#b85715" },
      green:  { k: "#0f1419", p: "#00ba7c", w: "#7fe0bd", s: "#00875a" },
      env:    { k: "#0f1419", t: "#f0c48a", d: "#d49a5c", w: "#fffdf8", r: "#1d9bf0", l: "#0f1419" },
      close:  { k: "#ffffff" }
    };
    const SPRITES = {
      dot: [
        "..kkkk..",
        ".kwwppk.",
        "kwppppsk",
        "kppppppk",
        "kppppppk",
        "kpppppsk",
        ".kpsssk.",
        "..kkkk.."
      ],
      close: [
        "kk...kk",
        "kkk.kkk",
        ".kkkkk.",
        "..kkk..",
        ".kkkkk.",
        "kkk.kkk",
        "kk...kk"
      ],
      envelope: [
        "kkkkkkkkkkkkkkkk",
        "kdkttttttttttkdk",
        "kddkttttttttkddk",
        "kdddkttttttkdddk",
        "kddddkttttkddddk",
        "kdddddkrrkdddddk",
        "kddddkkrrkkddddk",
        "kdddkttttttkdddk",
        "kddkttttttttkddk",
        "kdkttttttttttkdk",
        "kkttttttttttttkk",
        "kkkkkkkkkkkkkkkk"
      ],
      envelopeOpen: [
        "..kkkkkkkkkkkk..",
        "..kwwwwwwwwwwk..",
        "..kwrwrwwllwwk..",
        "..kwrrrwwwwwwk..",
        "..kwwrwwllllwk..",
        "kkkwwwwwwwwwwkkk",
        "kdkwllwllllwwkdk",
        "kddkwwwwwwwwkddk",
        "kdddkwwwwwwkdddk",
        "kddddkwwwwkddddk",
        "kdddddkrrkdddddk",
        "kddddkkrrkkddddk",
        "kdddkttttttkdddk",
        "kddkttttttttkddk",
        "kdkttttttttttkdk",
        "kkttttttttttttkk",
        "kkkkkkkkkkkkkkkk"
      ]
    };

    function pixelSVG(rows, palette, scale) {
      const width = rows[0].length;
      const height = rows.length;
      let rects = "";
      rows.forEach((row, y) => {
        [...row].forEach((cell, x) => {
          if (palette[cell]) rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${palette[cell]}"/>`;
        });
      });
      return `<svg class="sprite" width="${width * scale}" height="${height * scale}" viewBox="0 0 ${width} ${height}" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
    }

    document.querySelectorAll("[data-sprite]").forEach(element => {
      const name = element.dataset.sprite;
      const paletteName = element.dataset.colors || (name.startsWith("envelope") ? "env" : name === "close" ? "close" : "green");
      element.innerHTML = pixelSVG(SPRITES[name], PALETTES[paletteName], Number(element.dataset.scale || 3));
    });

    async function api(path, options = {}) {
      const response = await fetch(API_URL + path, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Something went wrong.");
      return data;
    }

    function showLetter(message) {
      const reveal = document.querySelector("#reveal");
      document.querySelector("#revealed-message").textContent = message;
      reveal.classList.remove("show");
      reveal.setAttribute("aria-hidden", "false");
      requestAnimationFrame(() => requestAnimationFrame(() => reveal.classList.add("show")));
      launchConfetti();
      document.querySelector("#close-reveal").focus();
    }

    function launchConfetti() {
      const canvas = document.querySelector("#confetti");
      const context = canvas.getContext("2d");
      const ratio = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * ratio;
      canvas.height = window.innerHeight * ratio;
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.imageSmoothingEnabled = false;
      const colors = ["#00ba7c", "#ef7d31", "#f91880", "#1d9bf0", "#ffffff", "#7fe0bd"];
      const heart = ["..x..", ".xxx.", "xxxxx", ".xxx.", "..x.."];
      const pieces = Array.from({ length: 110 }, () => ({
        x: Math.random() * window.innerWidth,
        y: -Math.random() * window.innerHeight,
        cell: Math.random() < .5 ? 3 : 4,
        speed: 1.5 + Math.random() * 3,
        sway: Math.random() * Math.PI * 2,
        isHeart: Math.random() < .55,
        color: colors[Math.floor(Math.random() * colors.length)]
      }));
      const started = performance.now();

      function frame(now) {
        context.clearRect(0, 0, window.innerWidth, window.innerHeight);
        for (const piece of pieces) {
          piece.y += piece.speed;
          piece.sway += .05;
          const cell = piece.cell;
          // snap to a pixel grid so it stays chunky
          const x = Math.round((piece.x + Math.sin(piece.sway) * 14) / cell) * cell;
          const y = Math.round(piece.y / cell) * cell;
          context.fillStyle = piece.color;
          if (piece.isHeart) {
            heart.forEach((row, ry) => [...row].forEach((c, rx) => {
              if (c === "x") context.fillRect(x + rx * cell, y + ry * cell, cell, cell);
            }));
          } else {
            context.fillRect(x, y, cell * 2, cell * 2);
          }
        }
        if (now - started < 3000) requestAnimationFrame(frame);
        else context.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }

      requestAnimationFrame(frame);
    }

    function hideLetter() {
      const reveal = document.querySelector("#reveal");
      reveal.classList.remove("show");
      reveal.setAttribute("aria-hidden", "true");
      document.querySelector("#guess-input").focus();
    }

    document.querySelector("#close-reveal").addEventListener("click", hideLetter);
    document.querySelector("#reveal").addEventListener("click", event => {
      if (event.target.id === "reveal") hideLetter();
    });

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab, .panel").forEach(element => element.classList.remove("active"));
        tab.classList.add("active");
        document.querySelector("#" + tab.dataset.tab).classList.add("active");
      });
    });

    document.querySelector("#save").addEventListener("click", async () => {
      const button = document.querySelector("#save");
      const status = document.querySelector("#set-status");
      const message = document.querySelector("#message").value.trim();
      if (!message) {
        status.textContent = "Please write a message.";
        return;
      }
      button.disabled = true;
      status.textContent = "Choosing the best word...";
      try {
        const data = await api("/api/message", {
          method: "POST",
          headers: { "X-Game-Admin-Key": document.querySelector("#admin-key").value },
          body: JSON.stringify({ message })
        });
        status.textContent = `The word has been set and is available to every player: ${data.word}`;
        resetGuesses();
        document.querySelector("#hint-status").textContent = "";
        document.querySelector("#hint-word").textContent = "";
        document.querySelector("#hint-button").disabled = false;
        localStorage.removeItem("message-contexto-hint-token");
      } catch (error) {
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });

    const guessRows = new Map();

    // Contexto's buckets: green = top 300, yellow = top 1500, red = everything else.
    function category(rank) {
      if (rank !== null && rank <= 300) return "green";
      if (rank !== null && rank <= 1500) return "yellow";
      return "red";
    }

    function guessStatus(rank) {
      if (rank == null) return "Keep guessing.";
      if (rank <= 10) return "SO close!!";
      if (rank <= 300) return "Very close!";
      if (rank <= 1500) return "Getting warm...";
      return "Far away. Keep guessing.";
    }

    function setGuessStatus(text, rank) {
      const status = document.querySelector("#guess-status");
      status.textContent = text;
      status.classList.remove("is-green", "is-yellow", "is-red");
      if (rank !== undefined) status.classList.add("is-" + category(rank));
    }

    function buildRow(word, rank, total, percentage, animateFill) {
      const row = document.createElement("div");
      row.className = "guess " + category(rank);
      if (rank === 1) row.classList.add("correct");
      const fill = document.createElement("div");
      fill.className = "fill";
      const name = document.createElement("span");
      name.className = "guess-name";
      name.textContent = word;
      const score = document.createElement("span");
      score.className = "score";
      score.textContent = rank === null ? "?" : rank;
      score.title = rank === null ? "" : `#${rank} of ${total} words`;
      row.append(fill, name, score);
      if (animateFill) {
        requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = percentage + "%"; }));
      } else {
        fill.style.width = percentage + "%";
      }
      return row;
    }

    function showLast(entry) {
      document.querySelectorAll("#guesses .guess.latest").forEach(element => element.classList.remove("latest"));
      entry.row.classList.add("latest");
      document.querySelector("#last-guess").replaceChildren(
        buildRow(entry.word, entry.rank, entry.total, entry.percentage, true)
      );
    }

    function updateStats() {
      document.querySelector("#guess-count").textContent = guessRows.size;
      document.querySelector("#stats").hidden = guessRows.size === 0;
      document.querySelector("#divider").hidden = guessRows.size === 0;
    }

    function resetGuesses() {
      guessRows.clear();
      document.querySelector("#guesses").replaceChildren();
      document.querySelector("#last-guess").replaceChildren();
      updateStats();
    }

    function addGuessRow(word, data) {
      const rank = data.rank ?? null;
      const percentage = Math.max(1, Math.round(data.score * 100));
      const entry = { word, rank, total: data.total, percentage };
      entry.row = buildRow(word, rank, data.total, percentage, true);
      guessRows.set(word, entry);

      // Keep the list sorted closest-first (moving nodes keeps their animations).
      const list = document.querySelector("#guesses");
      [...guessRows.values()]
        .sort((a, b) => (a.rank ?? Infinity) - (b.rank ?? Infinity))
        .forEach(item => list.append(item.row));
      showLast(entry);
      updateStats();
    }

    async function makeGuess() {
      const button = document.querySelector("#guess-button");
      const input = document.querySelector("#guess-input");
      const guess = input.value.trim();
      if (!guess) {
        setGuessStatus("Enter a guess.");
        return;
      }
      const existing = guessRows.get(guess.toLowerCase());
      if (existing) {
        showLast(existing);
        setGuessStatus(`You already guessed "${guess}" (#${existing.rank ?? "?"}).`, existing.rank);
        input.value = "";
        return;
      }
      button.disabled = true;
      try {
        const data = await api("/api/guess", {
          method: "POST",
          body: JSON.stringify({ guess })
        });
        addGuessRow(guess.toLowerCase(), data);
        setGuessStatus(data.correct ? "Correct! You found the word." : guessStatus(data.rank), data.rank ?? null);
        input.value = "";
        if (data.correct) {
          document.querySelector("#hint-button").disabled = true;
          showLetter(data.message || "The answer was set before message reveals were added. Ask the owner to set a new message.");
        }
        input.focus();
      } catch (error) {
        setGuessStatus(error.message);
      } finally {
        button.disabled = false;
      }
    }

    document.querySelector("#guess-button").addEventListener("click", makeGuess);
    document.querySelector("#guess-input").addEventListener("keydown", event => {
      if (event.key === "Enter") makeGuess();
    });

    document.querySelector("#hint-button").addEventListener("click", async () => {
      const button = document.querySelector("#hint-button");
      const status = document.querySelector("#hint-status");
      button.disabled = true;
      status.textContent = "Getting a hint...";
      try {
        const data = await api("/api/hint", {
          method: "POST",
          body: JSON.stringify({
            token: localStorage.getItem("message-contexto-hint-token")
          })
        });
        localStorage.setItem("message-contexto-hint-token", data.token);
        document.querySelector("#hint-word").textContent = data.pattern;
        if (data.revealed_count === 0) {
          status.textContent = `The word has ${data.letter_count} letters. Press again to reveal a random letter.`;
        } else {
          status.textContent = `Revealed ${data.revealed_count} of ${data.letter_count} letters.`;
        }
        if (data.complete) {
          button.disabled = true;
          status.textContent = "Every letter is revealed!";
          showLetter(data.message || "You revealed every letter!");
        } else {
          button.disabled = false;
        }
      } catch (error) {
        status.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
